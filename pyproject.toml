[project]
name = "incident-zero"
version = "0.2.0"
description = "An on-call agent that finds why a streaming service broke. Was it the deployment?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
oncall = "oncall.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905", "E501"]  # zip() over a list and its own tail is fine; the formatter owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
